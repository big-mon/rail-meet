<!doctype html>
<html lang="ja"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dots — 演出プレビュー</title><meta name="description" content="渋谷・新宿・池袋・千葉・横浜など76駅で、みんなの鉄道移動距離から集合駅を比較。実際の鉄道形状に沿った経路を表示します。"><meta name="theme-color" content="#163e36"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="portal.css"><link rel="preload" as="image" href="hero-smile.png"><link rel="preload" as="image" href="hero-mouth.png"><script defer src="vendor/leaflet.js"></script><script type="module" src="app.mjs"></script><link rel="stylesheet" href="showtime/showtime.css"><script type="module" src="showtime/showtime.mjs"></script></head>
<body class="showtime"><header><a class="brand" href="./" aria-label="dots ホーム"><span class="brand-icon">•••</span> dots<span class="brand-sub">鉄道距離で集まる</span></a><button id="add" type="button" disabled>＋ 参加者を追加</button><nav class="preview-nav"><span>演出プレビュー</span><a href="/">通常版へ</a></nav></header>
<main><section class="inputs panel" aria-labelledby="input-title"><h2 id="input-title" class="show-input-label">出発駅</h2><div id="origins" class="origin-grid"></div><div class="search-action"><img class="search-hero" src="hero-smile.png" width="122" height="129" alt="集合応援団ドッツン"><div class="search-button-wrap"><button id="find" class="find-button" type="button" disabled>集合場所を探す <span aria-hidden="true">↗</span></button></div></div></section>
<p id="status" role="status">鉄道データを読み込んでいます…</p><div id="results" hidden>
<section id="meeting" class="meeting" aria-live="polite"><div><p>集合はここ！</p><h2><span id="meeting-name"></span><span class="station-suffix">駅</span></h2></div></section>
<div class="workspace"><section class="map-panel panel" aria-label="鉄道経路の地図"><div class="map-heading"><div><h2 id="map-title"></h2></div><button id="fit" type="button">経路全体</button></div><section id="celebration" class="celebration" aria-label="遠征者の表彰"><div id="reward" aria-live="polite" aria-atomic="true"></div></section><div class="show-rays" aria-hidden="true"></div><img class="stage-hero" src="hero-smile.png" alt="" aria-hidden="true"><div class="show-shout" aria-hidden="true"></div><div class="show-flags" aria-hidden="true"><i></i><i></i><i></i></div><div id="map" role="region" aria-label="参加者ごとの鉄道経路。ドラッグで移動、プラスとマイナスで拡大縮小。"></div><div class="map-footer"><span id="background-status" class="small">都県境・海岸線の概略図</span></div><div id="legend" class="legend" aria-label="参加者ごとの色と経路表示"></div></section>
<section class="alternatives" aria-label="集合駅の候補"><div class="section-heading results-heading"><h2>集合駅の候補</h2><span class="small">最大距離が短い順</span></div><div id="candidates" class="candidates" aria-label="集合駅を選択"></div></section><section class="details panel" aria-labelledby="details-title"><h2 id="details-title"></h2><div id="summary"></div><div id="route-details"></div></section></div></div>
